<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USMS Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">⚖️</div>
                <div class="brand-text">
                    <strong>USMS Workspace</strong>
                    <span>Federal System</span>
                </div>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="decree">📜 Постановление</button>
                <button class="nav-item" data-tab="wanted">🔍 Розыск</button>
                <button class="nav-item" data-tab="settings">⚙️ Настройки профиля</button>
            </nav>
        </aside>

        <!-- Основная рабочая область -->
        <main class="workspace">
            
            <!-- Левая колонка: Форма -->
            <section class="editor-pane">
                <div class="pane-header">
                    <h2>Редактор постановления</h2>
                    <button id="addActionBtn" class="btn btn-primary">+ Добавить действие</button>
                </div>
                
                <div class="form-container">
                    <!-- Базовые поля -->
                    <div class="form-group-grid">
                        <div class="input-field">
                            <label>Номер (MSLR-№)</label>
                            <input type="text" id="orderNum" placeholder="600" value="600">
                        </div>
                        <div class="input-field">
                            <label>Номер иска</label>
                            <input type="text" id="caseNum" placeholder="2600">
                        </div>
                        <div class="input-field">
                            <label>Тип суда</label>
                            <select id="courtType">
                                <option value="окружной">Окружной</option>
                                <option value="апелляционный">Апелляционный</option>
                                <option value="верховный">Верховный</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Судья (Имя Фамилия)</label>
                            <input type="text" id="judgeName" placeholder="Имя Фамилия">
                        </div>
                        <div class="input-field">
                            <label>Должность судьи</label>
                            <select id="judgeRank">
                                <option value="окружного судьи">Окружной судья</option>
                                <option value="верховного судьи">Верховный судья</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Направляется (Фракция)</label>
                            <select id="targetFaction">
                                <option value="LSPD">LSPD</option>
                                <option value="FIB">FIB</option>
                                <option value="Гражданину">Гражданину</option>
                            </select>
                        </div>
                    </div>

                    <div class="divider">Действия к исполнению</div>
                    
                    <!-- Контейнер для динамических действий -->
                    <div id="actionsList" class="actions-list"></div>
                </div>
            </section>

            <!-- Правая колонка: Live Preview форума -->
            <section class="preview-pane">
                <div class="pane-header preview-header">
                    <div class="preview-tabs">
                        <button class="view-tab active" data-view="forum">Форум (GTA5RP)</button>
                        <button class="view-tab" data-view="bbcode">BBCode</button>
                    </div>
                    <button id="copyBtn" class="btn btn-success">Скопировать код</button>
                </div>
                
                <div class="preview-content">
                    <!-- Рендер как на форуме -->
                    <div id="forumRender" class="gta5rp-forum-theme"></div>
                    <!-- Сырой код -->
                    <textarea id="bbcodeOutput" class="raw-bbcode hidden" readonly></textarea>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
